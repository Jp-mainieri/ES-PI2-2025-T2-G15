<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NOTADEZ</title>
<!--Link para o arquivo base de CSS-->
    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/rec_senha.css">
    <!--Link para os icones-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!--Link para o arquivo de JavaScript-->
    <script src="../Scripts/main.js"></script>


</head>
<body>

    <header>
        <div class="logo">NotaDez</div>
        <nav>
            <a href="login.html" class="btn-login"><strong>LOGIN</strong></a>
        
        </nav>
    </header>

    <div class="login-container">
        <div class="form">
            <h3>Recupere a sua senha!</h3>
            <h4> Digite o e-mail utilizado no cadastro para redefinir sua senha.</h4>

            <form method="post" action="#">
                <label for="email"><strong>Email:</strong></label><br>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required><br><br>

                <div class="btn-container">
                    <button type="button" class="btn-entrar" onclick="enviarRecuperacao()">Confirmar</button>
                </div>
            </form>
        </div>
        

        <div class="imagem">
        <img src="../img/img_recuperacao_senha.png" alt="Imagem">
        </div>

        <div class="image-side">
            <!-- fundo cinza -->
        </div>

    </div>

    <script>
        async function enviarRecuperacao() {
        const btn = document.querySelector('.btn-entrar');
        try {
            btn.disabled = true;
            const email = document.getElementById('email').value;
            if (!email) return alert('Digite um email válido.');

            const res = await fetch("http://localhost:3000/recuperar-senha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
            });

            // Se redeu erro (ex: 404), isso pega o corpo e exibe
            let data;
            try { data = await res.json(); } catch (e) { data = { error: 'Resposta inválida do servidor.' }; }

            if (!res.ok) {
            alert(data.error || `Erro ${res.status}`);
            console.error('Resposta /recuperar-senha:', res.status, data);
            } else {
            alert(data.message || 'E-mail enviado com sucesso (verifique spam).');
            console.log('Sucesso:', data);
            }
        } catch (err) {
            // Erro de rede (servidor offline, CORS, etc.)
            console.error('Fetch error:', err);
            alert('Erro de rede ao contatar o servidor. Verifique se o backend está rodando e o console do servidor.');
        } finally {
            btn.disabled = false;
        }
        }
</script>



</body>
</html>
