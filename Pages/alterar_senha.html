<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NOTADEZ</title>
<!--Link para o arquivo base de CSS-->
    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/rec_senha.css">
    <!--Link para os icones-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!--Link para o arquivo de JavaScript-->
    <script src="../Scripts/main.js"></script>


</head>
<body>

    <header>
        <div class="logo">NotaDez</div>
        <nav>
            <a href="login.html" class="btn-login"><strong>LOGIN</strong></a>
        
        </nav>
    </header>

    <div class="login-container">
        <div class="form">
            <h3>Recupere a sua senha!</h3>
            <h4>Digite a sua nova senha</h4>

            <form method="post" action="#">
                <label for="senha"><strong>Digite sua nova senha:</strong></label><br>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>

                <label for="confirmar_senha"><strong>Confirme sua senha:</strong></label><br>
                <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirme sua senha" required><br><br>

                

                <div class="btn-container">
                    <button type="button" class="btn-entrar-alt" onclick="alterarSenha()"><strong>Alterar senha</strong></button>
                </div>
            </form>
        </div>
        

        <div class="imagem">
        <img src="../img/img_recuperacao_senha.png" alt="Imagem">
        </div>

        <div class="image-side">
            <!-- fundo cinza -->
        </div>

    </div>

    <script src="../Scripts/alterar_senha.js"></script>


</body>
</html>
