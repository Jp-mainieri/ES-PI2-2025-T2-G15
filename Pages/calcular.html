<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <link rel="stylesheet" href="../Styles/calcular.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div>
        <h2>NotaDez</h2>

        <p class="section-title">MENU</p>
        <div class="menu">
          <a href="dash.html" class="menu-item active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
          <a href="instituicoes.html" class="menu-item"><i class="fa-solid fa-school"></i> Instituições</a>
          <a href="alunos.html" class="menu-item"><i class="fa-solid fa-user-graduate"></i> Alunos</a>
          <a href="notas.html" class="menu-item"><i class="fa-solid fa-file-lines"></i> Notas</a>
          <a href="#" class="menu-item"><i class="fa-solid fa-calculator"></i> Cálculo da Nota</a>
          <a href="#" class="menu-item"><i class="fa-solid fa-magnifying-glass"></i> Auditoria</a>
        </div>
      </div>

      <div class="outros">
        <p class="section-title">OUTROS</p>
        <a href="../index.html" class="menu-item"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
      </div>
    </div>

    <div class="content">
        
          <h2>Notas</h2>
          
          <div class="form-group">
            <select class="select-field">
              <option>PUC - Campinas</option>
            </select>
            <i class="fa-solid fa-chevron-down select-icon"></i>
          </div>
  
          <div class="form-group">
            <select class="select-field">
              <option>Engenharia de Software</option>
            </select>
            <i class="fa-solid fa-chevron-down select-icon"></i>
          </div>
  
          <div class="form-group">
            <select class="select-field">
              <option>2025, 1° - Engenharia de Software 1A</option>
            </select>
            <i class="fa-solid fa-chevron-down select-icon"></i>
          </div>
          
          <div class="formula-section">
            <label for="formula">Definir Fórmula</label>
            <div class="formula-input-group">
              <input type="text" id="formula" class="text-field" value="(P1 + P2 + P3) / 3">
              <button class="btn btn-validate">Validar fórmula</button>
            </div>
          </div>
  
          <div class="components-section">
            <label>Componentes</label>
            <textarea class="textarea-field" readonly>P1
                P2
                P3
                Trabalho
            </textarea>
          </div>
  
          <div class="toggle-section">
              <label class="switch">
                  <input type="checkbox" id="toggle-adjusted-notes">
                  <span class="slider round"></span>
              </label>
              
              <label for="toggle-adjusted-notes" class="toggle-label">Adicionar coluna de Notas Finais Ajustadas</label>
          </div>
  
          <div class="actions">
            <button class="btn btn-save">Salvar</button>
            <button class="btn btn-cancel">Cancelar</button>
          </div>
  
        </div>
      
    </div>

    </div>
  </div>
</body>
</html>
