<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <link rel="stylesheet" href="../Styles/calcular.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div>
        <h2>NotaDez</h2>

        <p class="section-title">MENU</p>
        <div class="menu">
          <a href="dash.html" class="menu-item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
          <a href="instituicoes.html" class="menu-item"><i class="fa-solid fa-school"></i> Instituições</a>
          <a href="alunos.html" class="menu-item"><i class="fa-solid fa-user-graduate"></i> Alunos</a>
          <a href="notas.html" class="menu-item "><i class="fa-solid fa-file-lines"></i> Notas</a>
          <a href="#" class="menu-item active"><i class="fa-solid fa-calculator"></i> Cálculo da Nota</a>
        </div>
      </div>

      <div class="outros">
        <p class="section-title">OUTROS</p>
        <a href="../index.html" class="menu-item"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
      </div>
    </div>

    <div class="content">
        
          <h2>Componentes de nota e Fórmula</h2>
          
          <div class="form-group">
              <label for="select-instituicao">Instituição</label>
            <select class="select-field sortInstituicao" id="select-instituicao">
              <option value="-1">Instituição</option>
            </select>
            <i class="fa-solid fa-chevron-down select-icon"></i>
          </div>
  
          <div class="form-group">
              <label for="select-curso">Curso</label>
            <select class="select-field sortCurso" id="select-curso">
              <option value="-1">Curso</option>
            </select>
            <i class="fa-solid fa-chevron-down select-icon"></i>
          </div>
  
          <div class="form-group">
              <label for="select-disciplina">Disciplina</label>
            <select class="select-field sortDisciplina" id="select-disciplina">
              <option value="-1">Disciplinas</option>
            </select>
            <i class="fa-solid fa-chevron-down select-icon"></i>
          </div>
<hr style="margin: 30px">
          <div class="components-section">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px">
            <label>Componentes</label>
                  <div>
                      <button class="btn btn-validate" id="btn-adc-componente">Adicionar Componente</button>
                      <button class="btn btn-validate" id="btn-salvar-alteracoes">Salvar Alterações</button>
                  </div>
              </div>
            <table class="tabelas" id="tabela-componentes">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Sigla</th>
                        <th>Descrição</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
          </div>

          <div class="formula-section">
            <label for="formula">Definir Fórmula <span style="color: rgb(23, 53, 109); margin-left: 60px">Dica: (Use "$" antes de cada sigla de componente de nota)</span></label>
            <div class="formula-input-group">
              <input type="text" id="formula" class="text-field" value="">
              <button type="button" class="btn btn-validate" id="btn-validar-formula">Validar fórmula</button>
            </div>
          </div>
  
        </div>
      
    </div>
  <script src="../Scripts/calcular.js"></script>
</body>
</html>
