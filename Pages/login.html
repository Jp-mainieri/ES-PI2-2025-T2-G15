<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NOTADEZ</title>
<!--Link para o arquivo base de CSS-->
    <link rel="stylesheet" href="../Styles/base.css">
    <link rel="stylesheet" href="../Styles/login.css">
    <!--Link para os icones-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!--Link para o arquivo de JavaScript-->
    <script src="../Scripts/main.js"></script>


</head>
<body>

    <header>
        <div class="logo">NotaDez</div>
        <nav>
            <a href="login.html" class="btn-login"><strong>LOGIN</strong></a>
            <a href="cadastro.html"><strong>CADASTRO</strong></a>
        </nav>
    </header>

    <div class="login-container">
        <div class="form">
            <h3>Bem-vindo(a) de volta!</h3>

            <form method="post" action="#">
                <label for="email"><strong>Email:</strong></label><br>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required><br><br>

                <label for="senha"><strong>Senha:</strong></label><br>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>

                <div class="btn-container">
                    <a href="home.html" class="btn-entrar"><strong>Entrar</strong></a>
                    <p id="esqueceu-senha">Esqueceu sua senha? <a href="cadastro.html">Clique aqui</a></p>
                </div>
            </form>
        </div>

        <div class="capelo">
        <img src="../img/capelo.png" alt="Capelo">
        </div>

        <div class="image-side">
            <!-- fundo cinza -->
        </div>

    </div>


</body>
</html>
